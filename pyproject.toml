[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "relayledger"
version = "0.1.0"
description = "Transactional SQLite outbox with leased HTTP delivery, ordered streams and an idempotent inbox"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Abdul Rafay"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Topic :: System :: Distributed Computing"]

[project.urls]
Repository = "https://github.com/ABRJrocks/relayledger"
Issues = "https://github.com/ABRJrocks/relayledger/issues"

[project.scripts]
relayledger = "relayledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
